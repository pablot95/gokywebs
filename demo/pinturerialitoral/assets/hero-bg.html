<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="light"/>
<title>Pinturería Litoral</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;overflow-x:hidden}
  body{height:500vh;background:#bcd8e6}
  /* Static gradient base: visible before load and as no-WebGL fallback */
  #fallback{
    position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg,#e2f0f2 0%,#bcd8e6 26%,#7db2cf 48%,#3f9068 78%,#1f4f46 100%);
  }
  #bg{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:1}
</style>
</head>
<body>
<div id="fallback"></div>
<canvas id="bg"></canvas>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('bg');

/* ---------- capability + environment ---------- */
function webglOK(){
  try{
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
  }catch(e){ return false; }
}
if(!webglOK()){ canvas.style.display='none'; /* fallback gradient remains */ }
else { try { boot(); } catch(err){ canvas.style.display='none'; } }

function boot(){
  const isMobile = window.matchMedia('(max-width:820px)').matches || ('ontouchstart' in window);
  const motionOK = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- helpers ---------- */
  const clamp = (v)=>Math.min(1,Math.max(0,v));
  const damp = (a,b,l,dt)=> b + (a-b)*Math.exp(-l*dt);
  function sampleNum(p, arr){
    const n = arr.length-1; const t = clamp(p)*n;
    const i = Math.min(Math.floor(t), n-1); const f = t-i; const s = f*f*(3-2*f);
    return arr[i]*(1-s) + arr[i+1]*s;
  }
  function sampleColor(p, cols, out){
    const n = cols.length-1; const t = clamp(p)*n;
    const i = Math.min(Math.floor(t), n-1); const f = t-i; const s = f*f*(3-2*f);
    return out.copy(cols[i]).lerp(cols[i+1], s);
  }

  /* ---------- brand keyframes (celeste sky → verde litoral, 5 stops = 4 zones) ---------- */
  const COLA = ['#d6ebf0','#c2e0e8','#93c0c4','#cfe6e2','#e4f1f2'].map(h=>new THREE.Color(h)); // upper / air
  const COLB = ['#7db2cf','#3f9068','#1f4f46','#2f8f74','#57a98a'].map(h=>new THREE.Color(h)); // lower / water-verde
  const CAMY  = [2.5, 2.0, 4.0, 7.5, 11.0];   // low skim → elevated open expanse
  const PITCH = [-1.8,-0.6, 0.6, 1.6, 2.6];   // look down early → level/up late
  const AMP   = [1.5, 1.2, 2.0, 1.4, 0.9];    // wave amplitude per zone
  const FOGD  = [0.013,0.011,0.014,0.010,0.0065];
  const camStartZ = 32, camEndZ = -360;

  /* ---------- shared uniforms ---------- */
  const U = {
    uTime:{value:0}, uAmp:{value:1.5}, uCamY:{value:CAMY[0]},
    uColorA:{value:COLA[0].clone()}, uColorB:{value:COLB[0].clone()},
    uFogColor:{value:new THREE.Color('#a9c9d6')}, uFogDensity:{value:FOGD[0]},
    uBandInner:{value:3.0}, uBandOuter:{value:8.0}, uSpread:{value:1.0}
  };

  /* ---------- renderer / scene / camera ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:!isMobile, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isMobile?1.5:2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(56, 1, 0.1, 1000);
  scene.add(camera);

  /* ---------- sky dome (constant brand gradient behind everything, follows camera) ---------- */
  const skyMat = new THREE.ShaderMaterial({
    uniforms:{ uColorA:U.uColorA, uColorB:U.uColorB },
    vertexShader:`varying float vY; void main(){ vY = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`precision mediump float; uniform vec3 uColorA,uColorB; varying float vY;
      void main(){ float t = smoothstep(-0.18,0.62,vY); gl_FragColor = vec4(mix(uColorB,uColorA,t),1.0); }`,
    side:THREE.BackSide, depthWrite:false, depthTest:false, fog:false
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(400,32,16), skyMat);
  sky.renderOrder = -999; sky.frustumCulled = false;
  camera.add(sky);

  /* ---------- fluvial topographic strata (the brand geometry) ---------- */
  const SHEET_V = `
    uniform float uTime,uAmp,uPhase; varying float vViewZ,vWorldY;
    void main(){
      vec3 pos = position;
      float w = sin(pos.x*0.11 + uTime*0.9 + uPhase)*0.5
              + sin(pos.z*0.055 - uTime*0.6 + uPhase*1.7)*0.85
              + sin(pos.x*0.03 + pos.z*0.045 + uTime*0.4)*0.55;
      pos.y += w*uAmp;
      vec4 world = modelMatrix * vec4(pos,1.0);
      vWorldY = world.y;
      vec4 mv = viewMatrix * world; vViewZ = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`;
  const SHEET_F = `
    precision mediump float;
    uniform float uCamY,uBandInner,uBandOuter,uFogDensity;
    uniform vec3 uColorA,uColorB,uFogColor; varying float vViewZ,vWorldY;
    void main(){
      float h = clamp((vWorldY+20.0)/40.0,0.0,1.0);
      vec3 col = mix(uColorB,uColorA,h);
      float fogF = 1.0 - exp(-uFogDensity*max(vViewZ,0.0));
      col = mix(col,uFogColor,clamp(fogF,0.0,1.0));
      float alpha = 0.9;
      alpha *= smoothstep(uBandInner,uBandOuter, abs(vWorldY-uCamY));   /* breathable center */
      alpha *= smoothstep(2.0,10.0,vViewZ);                            /* no near clipping */
      alpha *= (1.0 - smoothstep(0.9,1.0,fogF));                       /* fade into sky */
      if(alpha < 0.02) discard;
      gl_FragColor = vec4(col,alpha);
    }`;
  function makeSheetMat(phase){
    return new THREE.ShaderMaterial({
      uniforms:{ uTime:U.uTime,uAmp:U.uAmp,uPhase:{value:phase},uCamY:U.uCamY,
        uColorA:U.uColorA,uColorB:U.uColorB,uFogColor:U.uFogColor,uFogDensity:U.uFogDensity,
        uBandInner:U.uBandInner,uBandOuter:U.uBandOuter },
      vertexShader:SHEET_V, fragmentShader:SHEET_F,
      transparent:true, side:THREE.DoubleSide, depthWrite:true
    });
  }
  const sheetGeo = new THREE.PlaneGeometry(130, 500, isMobile?24:36, isMobile?90:150);
  sheetGeo.rotateX(-Math.PI/2);                 // lie horizontal
  const levels = [-18,-13,-8,-3, 7, 12, 18];    // weight top & bottom, clear middle
  levels.forEach((y,i)=>{
    const m = new THREE.Mesh(sheetGeo, makeSheetMat(i*1.7));
    m.position.set(0, y, -185);                 // span journey depth
    m.frustumCulled = false;
    scene.add(m);
  });

  /* ---------- reed fibers (junco/totora) framing the sides, dense mid-journey ---------- */
  const REED_V = `
    attribute float aPhase; uniform float uTime,uSpread;
    varying float vViewZ,vT;
    void main(){
      vec3 pos = position; vT = clamp(pos.y,0.0,1.0);
      float sway = sin(uTime*1.1 + aPhase + pos.y*1.6) * 0.45 * vT;
      pos.x += sway;
      vec4 world = modelMatrix * instanceMatrix * vec4(pos,1.0);
      world.x *= uSpread;
      vec4 mv = viewMatrix * world; vViewZ = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`;
  const REED_F = `
    precision mediump float;
    uniform vec3 uColorA,uColorB,uFogColor; uniform float uFogDensity;
    varying float vViewZ,vT;
    void main(){
      vec3 col = mix(uColorB*0.75, uColorB*1.1, vT);
      col = mix(col, uColorA, smoothstep(0.75,1.0,vT)*0.22);
      float fogF = 1.0 - exp(-uFogDensity*max(vViewZ,0.0));
      col = mix(col,uFogColor,clamp(fogF,0.0,1.0));
      float alpha = 0.9 * (1.0 - smoothstep(0.9,1.0,fogF));
      alpha *= smoothstep(2.0,9.0,vViewZ);
      if(alpha < 0.02) discard;
      gl_FragColor = vec4(col,alpha);
    }`;
  const reedMat = new THREE.ShaderMaterial({
    uniforms:{ uTime:U.uTime,uSpread:U.uSpread,uFogDensity:U.uFogDensity,
      uColorA:U.uColorA,uColorB:U.uColorB,uFogColor:U.uFogColor },
    vertexShader:REED_V, fragmentShader:REED_F,
    transparent:true, side:THREE.DoubleSide, depthWrite:true
  });
  const reedGeo = new THREE.PlaneGeometry(0.5,1,1,4); reedGeo.translate(0,0.5,0);
  const reedMax = isMobile?200:400;
  const reedMesh = new THREE.InstancedMesh(reedGeo, reedMat, reedMax);
  reedMesh.frustumCulled = false;
  const dummy = new THREE.Object3D();
  const phases = new Float32Array(reedMax);
  let ri = 0;
  for(let k=0; k<reedMax*2 && ri<reedMax; k++){
    const z = 55 - Math.random()*480;              // along the journey
    const pz = (55 - z)/480;                        // 0..1 progress of this reed
    const win = Math.exp(-Math.pow((pz-0.35)/0.22,2)) + 0.8*Math.exp(-Math.pow((pz-0.62)/0.18,2)); // beds in zone B & C
    if(Math.random() > win) continue;               // open water zones stay sparse
    const side = Math.random()<0.5?-1:1;
    dummy.position.set(side*(12 + Math.random()*24), -6 + Math.random()*3, z);
    dummy.scale.set(0.7 + Math.random()*0.8, (3 + Math.random()*5)*(0.6 + win*0.8), 1);
    dummy.rotation.set(0,(Math.random()-0.5)*0.4,0);
    dummy.updateMatrix();
    reedMesh.setMatrixAt(ri, dummy.matrix);
    phases[ri] = Math.random()*6.283;
    ri++;
  }
  reedMesh.count = ri;
  reedMesh.instanceMatrix.needsUpdate = true;
  reedGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases,1));
  scene.add(reedMesh);

  /* ---------- scroll + postMessage control ---------- */
  let targetProgress = 0, progress = 0, external = false;
  const scrollProgress = ()=>{ const max = document.body.scrollHeight - window.innerHeight; return max>0 ? (window.scrollY||window.pageYOffset)/max : 0; };
  window.addEventListener('scroll', ()=>{ if(!external) targetProgress = clamp(scrollProgress()); }, {passive:true});
  window.addEventListener('message', (e)=>{
    const d = e.data;
    if(d && d.type==='scroll' && typeof d.progress==='number' && isFinite(d.progress)){
      external = true; targetProgress = clamp(d.progress);
    }
  });
  targetProgress = clamp(scrollProgress());
  progress = targetProgress;

  /* ---------- cursor parallax (desktop; silent on touch) ---------- */
  let mx=0,my=0,tmx=0,tmy=0;
  const paraX = motionOK?1.6:0.5, paraY = motionOK?0.9:0.3;
  window.addEventListener('pointermove', (e)=>{
    if(e.pointerType==='touch') return;
    tmx = (e.clientX/window.innerWidth)*2-1;
    tmy = (e.clientY/window.innerHeight)*2-1;
  }, {passive:true});

  /* ---------- resize / responsive framing ---------- */
  function onResize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w,h,false);
    const aspect = w/h; camera.aspect = aspect;
    const portrait = aspect < 1;
    camera.fov = portrait ? 74 : 56;               // see more vertically on 9:16
    U.uSpread.value = portrait ? 1.7 : 1.0;        // push reeds to the edges in portrait
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();

  /* ---------- loop ---------- */
  const timeScale = motionOK ? 0.55 : 0.1;
  let raf = 0, last = performance.now();
  function tick(now){
    raf = requestAnimationFrame(tick);
    const dt = Math.min((now-last)/1000, 0.05); last = now;

    progress = damp(progress, targetProgress, 3.2, dt);
    const p = progress;

    sampleColor(p, COLA, U.uColorA.value);
    sampleColor(p, COLB, U.uColorB.value);
    U.uFogColor.value.copy(U.uColorA.value).lerp(U.uColorB.value, 0.55);
    U.uAmp.value = sampleNum(p, AMP);
    U.uFogDensity.value = sampleNum(p, FOGD);

    const camY = sampleNum(p, CAMY); U.uCamY.value = camY;
    const pitch = sampleNum(p, PITCH);
    const camZ = camStartZ + (camEndZ-camStartZ)*p;

    mx += (tmx-mx)*Math.min(1,dt*4); my += (tmy-my)*Math.min(1,dt*4);
    U.uTime.value += dt * timeScale;
    const idleX = motionOK ? Math.sin(U.uTime.value*0.2)*0.15 : 0;   // minimal, near-imperceptible drift

    camera.position.set(idleX + mx*paraX, camY + my*paraY, camZ);
    camera.lookAt(mx*paraX*0.25, camY + pitch + my*paraY*0.25, camZ - 42);

    renderer.render(scene, camera);
  }
  raf = requestAnimationFrame(tick);

  /* ---------- pause when hidden / handle context loss ---------- */
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ if(raf) cancelAnimationFrame(raf); raf = 0; }
    else if(!raf){ last = performance.now(); raf = requestAnimationFrame(tick); }
  });
  canvas.addEventListener('webglcontextlost', (e)=>{ e.preventDefault(); if(raf) cancelAnimationFrame(raf); raf = 0; });
}
</script>
</body>
</html>
