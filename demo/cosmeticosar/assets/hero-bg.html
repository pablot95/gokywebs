<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="light"/>
<title>Cosméticos Ar</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;overflow-x:hidden}
  body{height:500vh;background:#f3ede9}
  /* Warm-white atmosphere: the permanent backdrop AND the no-WebGL fallback.
     The transparent canvas renders the ribbons on top of this. */
  #fallback{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(125% 92% at 50% 40%, rgba(0,0,0,0) 54%, rgba(38,26,24,0.075) 100%),
      linear-gradient(180deg,#f7f2ef 0%,#f4efeb 44%,#efe8e4 78%,#eae1dc 100%);
  }
  #bg{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:1}
</style>
</head>
<body>
<div id="fallback"></div>
<canvas id="bg"></canvas>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('bg');

/* ---------- capability check ---------- */
function webglOK(){
  try{
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
  }catch(e){ return false; }
}
if(!webglOK()){ canvas.style.display='none'; }        /* backdrop gradient remains as fallback */
else { try{ boot(); }catch(err){ canvas.style.display='none'; } }

/* =====================================================================
   CONCEPTO VISUAL — COSMÉTICOS AR
   Gramática propia: un CORREDOR DE CINTAS DE RASO. Bandas planas, mates y
   fluidas —como seda o el remolino de un sérum al verterse— que ondulan
   por las paredes del recorrido. La cámara avanza por el centro (siempre
   despejado para el texto); el peso visual queda en los laterales, los
   bordes y la profundidad. Reconocible en escala de grises por la forma
   de las cintas, no por el color. Recorrido en 4 zonas:
     Z0 sobrio y abierto  — pocas cintas grafito, amplias, luz alta
     Z1 se aproximan      — aparece el rojo, más torsión
     Z2 clímax dramático  — densas, rojo profundo, niebla, contraste
     Z3 llegada aireada    — se abren y aclaran, rosa pálido, luminoso
   ===================================================================== */
function boot(){
  const isMobile = window.matchMedia('(max-width:820px)').matches || ('ontouchstart' in window);
  const motionOK = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- helpers ---------- */
  const clamp = (v)=>Math.min(1,Math.max(0,v));
  const damp  = (a,b,l,dt)=> b + (a-b)*Math.exp(-l*dt);   // b -> a
  function sampleNum(p, arr){
    const n = arr.length-1; const t = clamp(p)*n;
    const i = Math.min(Math.floor(t), n-1); const f = t-i; const s = f*f*(3-2*f);
    return arr[i]*(1-s) + arr[i+1]*s;
  }
  function sampleColor(p, cols, out){
    const n = cols.length-1; const t = clamp(p)*n;
    const i = Math.min(Math.floor(t), n-1); const f = t-i; const s = f*f*(3-2*f);
    return out.copy(cols[i]).lerp(cols[i+1], s);
  }
  let seed = 20240714;
  const rnd = ()=>{ seed = (seed*1664525 + 1013904223) & 0xffffffff; return (seed>>>0)/4294967296; };
  const rrange = (a,b)=> a + (b-a)*rnd();

  /* ---------- brand keyframes (5 stops = 4 evolving zones) ---------- */
  const RIBCOL = ['#2b2320','#b62a2e','#7c1a1f','#e0bdb6'].map(h=>new THREE.Color(h)); // grafito -> rojo -> rojo hondo -> rosa pálido
  const FOGD   = [0.0052, 0.0092, 0.0125, 0.0082, 0.0034];  // niebla: clímax densa, llegada despejada
  const KEY    = [0.78, 0.94, 1.08, 0.98, 0.86];            // luz principal
  const HEMI   = [0.92, 0.84, 0.72, 0.86, 1.02];            // luz ambiental
  const CAMY   = [0.6, 1.0, 1.4, 1.0, 0.2];                 // altura del ojo
  const camStartZ = 18, camEndZ = -600;
  const zHead = 8, zTail = -560;   // reparto de las cintas en profundidad
  const FOGCOL = new THREE.Color('#f1eae6');

  /* ---------- renderer / scene / camera ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:!isMobile, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isMobile?1.5:2));
  renderer.setClearAlpha(0);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(FOGCOL.clone(), FOGD[0]);

  const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 1500);
  scene.add(camera);

  /* ---------- lights (soft, matte, premium) ---------- */
  const hemi = new THREE.HemisphereLight(0xfdf6f2, 0xcdbfb8, HEMI[0]);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfff3ea, KEY[0]);
  key.position.set(-0.55, 0.9, 0.45); scene.add(key);
  const fill = new THREE.DirectionalLight(0xf0dfe0, 0.32);
  fill.position.set(0.7, 0.15, 0.35); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffe1dc, 0.28);
  rim.position.set(0.1, -0.6, -0.8); scene.add(rim);

  /* ---------- ribbon geometry builder (flat twisting band) ---------- */
  function buildRibbon(points, segments, width, twist){
    const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
    const pos = [], nor = [], idx = [];
    const up = new THREE.Vector3(0,1,0);
    const tan = new THREE.Vector3(), side = new THREE.Vector3(), nrm = new THREE.Vector3(), p = new THREE.Vector3();
    for(let i=0;i<=segments;i++){
      const t = i/segments;
      curve.getPointAt(t, p);
      curve.getTangentAt(t, tan).normalize();
      side.crossVectors(tan, up);
      if(side.lengthSq() < 1e-5) side.set(1,0,0);
      side.normalize().applyAxisAngle(tan, twist*t);
      nrm.crossVectors(side, tan).normalize();
      const w = width * Math.pow(Math.sin(Math.PI*t), 0.6) * 0.5;  // taper both ends
      pos.push(p.x+side.x*w, p.y+side.y*w, p.z+side.z*w,
               p.x-side.x*w, p.y-side.y*w, p.z-side.z*w);
      nor.push(nrm.x,nrm.y,nrm.z, nrm.x,nrm.y,nrm.z);
      if(i<segments){ const k=i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
    g.setIndex(idx);
    return g;
  }

  /* ---------- author the ribbons across the 4 depth zones ---------- */
  const world = new THREE.Group(); scene.add(world);
  const seg = isMobile ? 42 : 64;
  const slices = isMobile ? 8 : 14;
  const tmpc = new THREE.Color();

  function addRibbon(s, baseAngle){
    const R    = sampleNum(s,[11.5,12.5,13.5,16.5,21]) + rrange(-1.2,1.6);
    const W    = sampleNum(s,[3.0,4.3,5.6,6.2,6.6]) * rrange(0.85,1.15);
    const twist= sampleNum(s,[0.45,1.0,1.7,1.15,0.55]) * (rnd()<0.5?-1:1) * rrange(0.8,1.2);
    const swirl= sampleNum(s,[0.35,0.85,1.45,0.95,0.4]) * (rnd()<0.5?-1:1);
    const zLen = sampleNum(s,[52,62,82,72,92]) * rrange(0.9,1.15);
    const z0   = THREE.MathUtils.lerp(zHead, zTail, s) + rrange(-10,10);
    const theta= baseAngle + rrange(-0.42,0.42);
    const yOff = rrange(-1.4,1.4);
    const wob  = rrange(0.12,0.4), wobF = rrange(0.6,1.4), rF = rrange(0.5,1.3), ph = rrange(0,6.28);

    const M = 8, pts = [];
    for(let k=0;k<=M;k++){
      const u = k/M;
      const ang = theta + swirl*u + wob*Math.sin(u*wobF*6.283 + ph);
      const r   = R + (R*0.16)*Math.sin(u*rF*6.283 + ph*1.7);
      pts.push(new THREE.Vector3(Math.cos(ang)*r, Math.sin(ang)*r*0.82 + yOff, z0 - u*zLen));
    }
    const mat = new THREE.MeshStandardMaterial({
      color: sampleColor(s, RIBCOL, tmpc).clone(),
      roughness: 0.62, metalness: 0.0, side: THREE.DoubleSide, fog: true
    });
    world.add(new THREE.Mesh(buildRibbon(pts, seg, W, twist), mat));
  }

  for(let i=0;i<slices;i++){
    const s = i/(slices-1);
    addRibbon(s, 0);        // lado derecho
    addRibbon(s, Math.PI);  // lado izquierdo
    // refuerzo en bordes, concentrado en el clímax (Z1–Z2) y solo en desktop
    if(!isMobile && s>0.22 && s<0.82 && i%2===1) addRibbon(s, rnd()<0.5 ? Math.PI/2 : -Math.PI/2);
  }

  /* ---------- scroll / iframe control ---------- */
  let target = 0, prog = 0, externalControl = false;
  const internalProgress = ()=>{
    const max = (document.body.scrollHeight - window.innerHeight);
    return max>0 ? clamp(window.scrollY / max) : 0;
  };
  target = prog = internalProgress();
  addEventListener('scroll', ()=>{ if(!externalControl) target = internalProgress(); }, {passive:true});
  addEventListener('message', (e)=>{
    const d = e.data;
    if(d && d.type==='scroll' && typeof d.progress==='number' && isFinite(d.progress)){
      externalControl = true;
      target = clamp(d.progress);
    }
  });

  /* ---------- cursor micro-interaction (parallax) ---------- */
  let pmx=0, pmy=0, mx=0, my=0;
  const PAR = (isMobile?0:1) * (motionOK?1:0.15);
  addEventListener('pointermove', (e)=>{
    if(e.pointerType==='touch') return;
    pmx = (e.clientX/window.innerWidth  - 0.5)*2;
    pmy = (e.clientY/window.innerHeight - 0.5)*2;
  }, {passive:true});

  /* ---------- resize / responsive framing ---------- */
  function resize(){
    const w = window.innerWidth, h = window.innerHeight, a = w/h;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isMobile?1.5:2));
    renderer.setSize(w, h, false);
    camera.aspect = a;
    // widen FOV in portrait so laterals stay in frame without cropping the center
    camera.fov = THREE.MathUtils.clamp(50 * (1 + 0.62*Math.max(0, 1 - a)), 50, 84);
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  /* ---------- render loop ---------- */
  const MICRO = motionOK ? 0.13 : 0.0;
  const tmpV = new THREE.Vector3();
  let last = performance.now(), raf = 0, running = false;

  function frame(now){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    const t = now*0.001;

    prog = damp(target, prog, motionOK?6.0:12.0, dt);
    mx   = damp(pmx, mx, 3.5, dt);
    my   = damp(pmy, my, 3.5, dt);

    const e = prog*prog*(3-2*prog);               // easeInOut: sensación de avance rápido en el medio
    const camZ = THREE.MathUtils.lerp(camStartZ, camEndZ, e);
    const camYb = sampleNum(prog, CAMY);

    camera.position.set(
      mx*PAR*1.6 + Math.sin(t*0.19)*MICRO,
      camYb + my*PAR*0.9 + Math.sin(t*0.25)*MICRO,
      camZ
    );
    camera.lookAt(-mx*PAR*0.5, camYb - my*PAR*0.3, camZ - 30);

    scene.fog.density = sampleNum(prog, FOGD);
    key.intensity  = sampleNum(prog, KEY);
    hemi.intensity = sampleNum(prog, HEMI);

    renderer.render(scene, camera);
  }
  function start(){ if(!running){ running=true; last=performance.now(); raf=requestAnimationFrame(frame); } }
  function stop(){ running=false; cancelAnimationFrame(raf); }
  document.addEventListener('visibilitychange', ()=> document.hidden ? stop() : start());
  start();
}
</script>
</body>
</html>
