<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Elegí la mejor versión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23E38A50'/%3E%3Ctext x='16' y='23' font-size='19' fill='%23fff' text-anchor='middle'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Outfit",system-ui,sans-serif;background:#FDF2E8;color:#2A2420;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.2rem;gap:2.6rem}
  h1{font-weight:700;font-size:clamp(1.9rem,4vw,2.7rem);letter-spacing:-.02em;text-align:center}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:1.6rem;width:min(1000px,100%)}
  .card{display:block;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 22px 50px -26px rgba(150,90,40,.5);transition:transform .35s cubic-bezier(0.22,1,0.36,1),box-shadow .35s;text-decoration:none;color:inherit}
  .card:hover,.card:focus-visible{transform:translateY(-8px);box-shadow:0 32px 62px -26px rgba(150,90,40,.6)}
  .card:focus-visible{outline:3px solid #E38A50;outline-offset:3px}
  .card .thumb{aspect-ratio:16/9;width:100%;background:#FBE7D4;overflow:hidden}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .label{padding:1rem 1.3rem;font-size:1.15rem;font-weight:600}
  @media (max-width:640px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
  <h1>Elegí la mejor versión.</h1>
  <div class="cards">
    <a class="card" href="version-1/">
      <span class="thumb"><img src="previews/version-1.webp" alt="Versión 1 — clara y luminosa, blanco y dorado con carta que se da vuelta" width="1440" height="810"></span>
      <span class="label">Versión 1</span>
    </a>
    <a class="card" href="version-2/">
      <span class="thumb"><img src="previews/version-2.webp" alt="Versión 2 — cálida e inmersiva, naranja con aura y órbita celestial" width="1440" height="810"></span>
      <span class="label">Versión 2</span>
    </a>
  </div>
  <script src="/demo/track.js" defer></script>
</body>
</html>
