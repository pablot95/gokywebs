<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="light"/>
<title>Alesantillan Cakes</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;overflow-x:hidden}
  body{height:500vh;background:#fbe9ef}
  /* Soft rose-sugar atmosphere: the permanent backdrop AND the no-WebGL fallback. */
  #fallback{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(120% 92% at 50% 42%, rgba(255,255,255,0.60) 0%, rgba(255,255,255,0) 48%),
      radial-gradient(120% 90% at 50% 48%, rgba(0,0,0,0) 60%, rgba(120,44,72,0.06) 100%),
      linear-gradient(180deg,#fef5f8 0%,#fbe9ef 44%,#f6dbe6 78%,#f0cede 100%);
  }
  #bg{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:1}
</style>
</head>
<body>
<div id="fallback"></div>
<canvas id="bg"></canvas>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('bg');

/* ---------- capability check ---------- */
function webglOK(){
  try{
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
  }catch(e){ return false; }
}
if(!webglOK()){ canvas.style.display='none'; }
else { try{ boot(); }catch(err){ canvas.style.display='none'; } }

/* =====================================================================
   CONCEPTO VISUAL — ALESANTILLAN CAKES  (cake atelier / pastelería creativa)
   Gramática propia: una CORONA DE GUIRNALDAS. Guirnaldas festoneadas —arcos
   drapeados de crema, como el borde piped de una torta— colgadas en ANILLO
   alrededor del eje de vuelo, tangentes al borde del cuadro, con hileras de
   grageas (perlas de azúcar) cayendo entre ellas. La cámara avanza por el
   NÚCLEO VACÍO de la corona: el centro queda estructuralmente despejado
   (nada se coloca por debajo del radio interno) y todo el peso cae en los
   laterales, arriba, abajo y en la profundidad. Reconocible en gris por los
   arcos drapeados + collares de perlas, no por el color. La cámara cruza una
   sucesión de "pórticos" festoneados que evolucionan en 4 zonas:
     Z0 reposo       — pocos arcos amplios, corona abierta, crema, mucho aire
     Z1 aproximación — más guirnaldas, se cierran, primeras perlas y dorado
     Z2 el salón     — pórticos enormes que enmarcan el borde, rosa hondo, niebla
     Z3 coronación   — la corona se abre, perlas y polvo dorado, aireado
   ===================================================================== */
function boot(){
  const isMobile = window.matchMedia('(max-width:820px)').matches || ('ontouchstart' in window);
  const motionOK = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- helpers ---------- */
  const clamp = (v)=>Math.min(1,Math.max(0,v));
  const damp  = (a,b,l,dt)=> b + (a-b)*Math.exp(-l*dt);
  function sampleNum(p, arr){
    const n = arr.length-1; const t = clamp(p)*n;
    const i = Math.min(Math.floor(t), n-1); const f = t-i; const s = f*f*(3-2*f);
    return arr[i]*(1-s) + arr[i+1]*s;
  }
  function sampleColor(p, cols, out){
    const n = cols.length-1; const t = clamp(p)*n;
    const i = Math.min(Math.floor(t), n-1); const f = t-i; const s = f*f*(3-2*f);
    return out.copy(cols[i]).lerp(cols[i+1], s);
  }
  let seed = 48091;
  const rnd = ()=>{ seed = (seed*1664525 + 1013904223) & 0xffffffff; return (seed>>>0)/4294967296; };
  const rrange = (a,b)=> a + (b-a)*rnd();

  /* ---------- brand keyframes (5 stops = 4 evolving zones) ---------- */
  const FOGD   = [0.0058, 0.0098, 0.0160, 0.0118, 0.0058];
  const KEY    = [0.95, 1.02, 1.10, 1.02, 0.98];
  const HEMI   = [1.06, 1.00, 0.90, 1.00, 1.16];
  const CAMY   = [0.2, 0.4, 0.7, 0.3, -0.1];
  const FOGCOL = ['#fbeef2','#f8e6ee','#faedf3'].map(h=>new THREE.Color(h));
  const RIN    = [8.5, 9.0, 10.5, 13.5, 10.5];    // radio INTERNO de la corona -> núcleo vacío por zona
  const RBAND  = [5.5, 6.5, 9.0, 8.0, 6.5];       // ancho del anillo de guirnaldas
  const camStartZ = 18, camEndZ = -560;
  const zHead = 8, zTail = -540;

  /* ---------- renderer / scene / camera ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:!isMobile, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isMobile?1.5:2));
  renderer.setClearAlpha(0);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(FOGCOL[0].clone(), FOGD[0]);

  const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 1500);
  scene.add(camera);

  /* ---------- lights (soft, matte, premium — satin buttercream) ---------- */
  const hemi = new THREE.HemisphereLight(0xfff6f4, 0xe6cdd6, HEMI[0]); scene.add(hemi);
  const key  = new THREE.DirectionalLight(0xfff3ef, KEY[0]); key.position.set(-0.55,0.92,0.42); scene.add(key);
  const fill = new THREE.DirectionalLight(0xf7e3ec, 0.30); fill.position.set(0.7,0.1,0.4); scene.add(fill);
  const rim  = new THREE.DirectionalLight(0xffe7ee, 0.24); rim.position.set(0.1,-0.65,-0.75); scene.add(rim);

  /* ---------- material pool ---------- */
  const mk = (hex, rough, opts={}) => new THREE.MeshStandardMaterial(Object.assign(
    { color:new THREE.Color(hex), roughness:rough, metalness:0.0, side:THREE.DoubleSide, fog:true }, opts));
  const matWhite  = mk('#fbf3f1', 0.60);
  const matPetal  = mk('#f6d9e0', 0.58);
  const matRose   = mk('#eaa9bd', 0.52);
  const matDeep   = mk('#d97f9c', 0.54);
  const matShadow = mk('#e7b9c4', 0.64);
  const matGold   = mk('#caa15a', 0.50);
  const matGhost  = mk('#f7e4ea', 0.72, { transparent:true, opacity:0.40, depthWrite:false });
  const matPearl  = mk('#f7ecec', 0.40);
  const matPearlG = mk('#d8b268', 0.46);

  function chooseMat(s){
    if(s>0.64 && rnd()<0.14) return matGhost;
    if(rnd() < sampleNum(s,[0.03,0.10,0.15,0.13,0.09])) return matGold;
    const roseP = sampleNum(s,[0.06,0.24,0.52,0.46,0.20]);
    if(rnd()<roseP){
      const deepP = sampleNum(s,[0.20,0.36,0.60,0.48,0.18]);
      return rnd()<deepP ? matDeep : matRose;
    }
    if(s>0.5 && rnd()<0.34) return matPetal;
    const r=rnd(); return r<0.55 ? matWhite : (r<0.82 ? matPetal : matShadow);
  }

  /* ---------- geometry: draped festoon garland (a catenary ribbon, thicker mid, thin ends) ----------
     Built in local space: x = span (tangent), y = droop (down), z = forward bow.
     Radial depth (what could reach the centre) is only sag+width — kept small; scaled mostly on x. */
  const gSegs = isMobile?54:96;
  function buildGarland(span, sag, width, bow){
    const pos=[], nor=[], idx=[];
    const P=new THREE.Vector3(), Pn=new THREE.Vector3(), Tan=new THREE.Vector3(),
          W=new THREE.Vector3(), UP=new THREE.Vector3(0,0,1);
    const curve=(u,out)=>{
      const d=1-Math.pow(2*u-1,2);               // 0 at ends, 1 at mid
      out.set((u-0.5)*span, -sag*d, bow*d);
    };
    for(let i=0;i<=gSegs;i++){
      const u=i/gSegs; curve(u,P); curve(Math.min(1,u+0.001),Pn);
      Tan.subVectors(Pn,P).normalize();
      W.crossVectors(Tan,UP).normalize();
      const d=1-Math.pow(2*u-1,2);
      const hw=0.5*width*(0.35+0.65*d);          // fatter belly, thin tips (piped shell)
      let nx=Tan.y*W.z-Tan.z*W.y, ny=Tan.z*W.x-Tan.x*W.z, nz=Tan.x*W.y-Tan.y*W.x;
      const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
      pos.push(P.x-W.x*hw,P.y-W.y*hw,P.z-W.z*hw, P.x+W.x*hw,P.y+W.y*hw,P.z+W.z*hw);
      nor.push(nx,ny,nz,nx,ny,nz);
      if(i<gSegs){ const k=i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2); }
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
    g.setIndex(idx); return g;
  }
  const garlands = [
    buildGarland(3.0, 1.30, 0.62, 0.9),
    buildGarland(3.6, 1.05, 0.50, 1.2),
    buildGarland(2.4, 1.55, 0.72, 0.6),
    buildGarland(4.0, 0.90, 0.44, 1.4),
    buildGarland(3.2, 1.20, 0.58, 1.0)
  ];
  const pearlGeo = new THREE.IcosahedronGeometry(1, isMobile?0:1);

  /* ---------- author the crown: garlands + pearl drops on an annulus (empty core) ---------- */
  const world = new THREE.Group(); scene.add(world);
  const YSQ = 0.80;    // slight vertical squash so the crown also hugs 16:9 top/bottom edges

  function makeCluster(s){
    const grp = new THREE.Group();
    const nG = isMobile ? (1+Math.floor(rnd()*2)) : (2+Math.floor(rnd()*2));
    for(let k=0;k<nG;k++){
      const m = new THREE.Mesh(garlands[Math.floor(rnd()*garlands.length)], chooseMat(s));
      const sx = rrange(1.3,2.4);                 // stretch along the tangent (wraps the edge)
      const sr = rrange(0.7,1.1);                 // keep radial depth small -> never invades centre
      m.scale.set(sx, sr, sr);
      m.position.set(rrange(-1.4,1.4), rrange(-0.6,0.9)*k, rrange(-1.2,1.2));
      m.rotation.set(rrange(-0.18,0.18), rrange(-0.25,0.25), rrange(-0.12,0.12));
      grp.add(m);
    }
    if(s>0.22 && rnd()<0.7){                       // pearl collar dripping from the garland
      const n=3+Math.floor(rnd()*(isMobile?3:6)), gold=rnd()<0.34, mat=gold?matPearlG:matPearl;
      const x0=rrange(-1.2,1.2), drop=rrange(0.7,1.6);
      for(let i=0;i<n;i++){
        const m=new THREE.Mesh(pearlGeo,mat);
        m.position.set(x0+rrange(-0.15,0.15), -0.4 - i*drop, rrange(-0.4,0.4));
        m.scale.setScalar((0.11+rnd()*0.10)*rrange(0.85,1.25));
        grp.add(m);
      }
    }
    return grp;
  }

  const gates = isMobile?12:20;                     // "pórticos" a lo largo de la profundidad
  for(let gi=0; gi<gates; gi++){
    const s = gi/(gates-1);
    const zc = THREE.MathUtils.lerp(zHead, zTail, s) + rrange(-6,6);
    const rin = sampleNum(s,RIN), band = sampleNum(s,RBAND);
    const perGate = isMobile ? (2+Math.floor(rnd()*2)) : (3+Math.floor(rnd()*3));
    for(let j=0;j<perGate;j++){
      const ang = rnd()*Math.PI*2;
      const rr  = rin + rnd()*band;                 // >= rin  =>  núcleo SIEMPRE vacío
      const grp = makeCluster(s);
      grp.position.set(Math.cos(ang)*rr, Math.sin(ang)*rr*YSQ, zc + rrange(-4,4));
      grp.rotation.z = ang + Math.PI/2;             // tangente al anillo -> drapea a lo largo del borde
      grp.rotation.y = rrange(-0.35,0.35);
      grp.rotation.x = rrange(-0.15,0.15);
      world.add(grp);
    }
  }

  /* ---------- gold sugar dust (subtle, deep zones only) — also on an annulus ---------- */
  const dustN = isMobile?140:320;
  const dpos = new Float32Array(dustN*3);
  for(let i=0;i<dustN;i++){
    const ang=rnd()*6.283, rad=6+rnd()*14;
    dpos[i*3]=Math.cos(ang)*rad; dpos[i*3+1]=Math.sin(ang)*rad*YSQ; dpos[i*3+2]=THREE.MathUtils.lerp(-560,-240,rnd());
  }
  const dgeo = new THREE.BufferGeometry();
  dgeo.setAttribute('position', new THREE.BufferAttribute(dpos,3));
  const dmat = new THREE.PointsMaterial({ color:new THREE.Color('#e4bd77'), size:isMobile?0.9:0.7,
    sizeAttenuation:true, transparent:true, opacity:0.0, depthWrite:false, fog:true });
  world.add(new THREE.Points(dgeo, dmat));

  /* ---------- scroll / iframe control ---------- */
  let target=0, prog=0, externalControl=false;
  const internalProgress = ()=>{ const max=document.body.scrollHeight-window.innerHeight; return max>0?clamp(window.scrollY/max):0; };
  target = prog = internalProgress();
  addEventListener('scroll', ()=>{ if(!externalControl) target=internalProgress(); }, {passive:true});
  addEventListener('message', (e)=>{
    const d=e.data;
    if(d && d.type==='scroll' && typeof d.progress==='number' && isFinite(d.progress)){ externalControl=true; target=clamp(d.progress); }
  });

  /* ---------- cursor micro-interaction (off on touch/mobile) ---------- */
  let pmx=0,pmy=0,mx=0,my=0;
  const PAR=(isMobile?0:1)*(motionOK?1:0.15);
  addEventListener('pointermove', (e)=>{ if(e.pointerType==='touch') return;
    pmx=(e.clientX/window.innerWidth-0.5)*2; pmy=(e.clientY/window.innerHeight-0.5)*2; }, {passive:true});

  /* ---------- resize / responsive framing ---------- */
  function resize(){
    const w=window.innerWidth,h=window.innerHeight,a=w/h;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isMobile?1.5:2));
    renderer.setSize(w,h,false);
    camera.aspect=a;
    camera.fov=THREE.MathUtils.clamp(50*(1+0.62*Math.max(0,1-a)),50,84);   // widen in portrait, keep crown framed
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  /* ---------- render loop ---------- */
  const MICRO = motionOK ? 0.10 : 0.0;
  const tmpFog = new THREE.Color();
  let last=performance.now(), raf=0, running=false;

  function frame(now){
    raf=requestAnimationFrame(frame);
    const dt=Math.min(0.05,(now-last)/1000); last=now; const t=now*0.001;

    prog=damp(target,prog,motionOK?6.0:12.0,dt);
    mx=damp(pmx,mx,3.5,dt); my=damp(pmy,my,3.5,dt);

    const e=prog*prog*(3-2*prog);
    const camZ=THREE.MathUtils.lerp(camStartZ,camEndZ,e);
    const camYb=sampleNum(prog,CAMY);

    camera.position.set(mx*PAR*1.5 + Math.sin(t*0.19)*MICRO,
                        camYb + my*PAR*0.8 + Math.sin(t*0.25)*MICRO, camZ);
    camera.lookAt(-mx*PAR*0.4, camYb - my*PAR*0.25, camZ-30);

    scene.fog.density=sampleNum(prog,FOGD);
    sampleColor(prog,FOGCOL,tmpFog); scene.fog.color.copy(tmpFog);
    key.intensity=sampleNum(prog,KEY); hemi.intensity=sampleNum(prog,HEMI);
    dmat.opacity=sampleNum(prog,[0.0,0.0,0.14,0.40,0.52]);

    renderer.render(scene,camera);
  }
  function start(){ if(!running){ running=true; last=performance.now(); raf=requestAnimationFrame(frame); } }
  function stop(){ running=false; cancelAnimationFrame(raf); }
  document.addEventListener('visibilitychange', ()=> document.hidden?stop():start());
  start();
}
</script>
</body>
</html>
