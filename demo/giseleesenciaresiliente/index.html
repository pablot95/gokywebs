<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Elegí la mejor versión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E8998D'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23FBF3EC' text-anchor='middle'%3Eg%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Fraunces",Georgia,serif;background:#F5EFE8;color:#3A2E28;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.2rem;gap:2.8rem}
  h1{font-weight:500;font-size:clamp(1.9rem,4vw,2.8rem);letter-spacing:-.01em;text-align:center}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:1.6rem;width:min(1000px,100%)}
  .card{display:block;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px -24px rgba(120,80,60,.4);transition:transform .35s cubic-bezier(0.23,1,0.32,1),box-shadow .35s;text-decoration:none;color:inherit}
  .card:hover,.card:focus-visible{transform:translateY(-8px);box-shadow:0 30px 60px -24px rgba(120,80,60,.5)}
  .card:focus-visible{outline:3px solid #D97D6E;outline-offset:3px}
  .card .thumb{aspect-ratio:16/9;width:100%;background:#E9DDCD;overflow:hidden}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .label{padding:1rem 1.3rem;font-size:1.15rem;font-weight:600}
  @media (max-width:640px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
  <h1>Elegí la mejor versión.</h1>
  <div class="cards">
    <a class="card" href="version-1/">
      <span class="thumb"><img src="previews/version-1.webp" alt="Versión 1 — dirección cálida y editorial, tonos crema y salmón" width="1440" height="810"></span>
      <span class="label">Versión 1</span>
    </a>
    <a class="card" href="version-2/">
      <span class="thumb"><img src="previews/version-2.webp" alt="Versión 2 — dirección terrosa y ontológica, tonos lino y terracota" width="1440" height="810"></span>
      <span class="label">Versión 2</span>
    </a>
  </div>
  <script src="/demo/track.js" defer></script>
</body>
</html>
