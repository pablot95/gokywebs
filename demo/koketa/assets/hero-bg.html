<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOKETA — Fondo hero animado (scroll-driven)</title>
<!--
  FONDO HERO ANIMADO · WebGL / Three.js · scroll-driven · KOKETA (moda · fucsia sobre blanco)
  - Solo fondo, full-bleed, sin textos (el contenido va en el centro, después).
  - El MOVIMIENTO lo maneja el SCROLL. Sin scroll queda casi quieto (deriva mínima).
  - Progreso 0→1 = viaje hacia adelante (zoom/profundidad) a través de 6 tramos distintos.
  - Altura 500vh. Lee su propio scroll Y acepta postMessage({type:'scroll', progress}).
  - Responsive 16:9 y 9:16. Sin video ni imágenes externas.
-->
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { height: 500vh; overflow-x: hidden; }
  #bg-canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    display: block; z-index: 0;
  }
  /* Viñeta suave: enfoca el centro (donde irá el texto) sobre el fondo claro */
  #vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 50%, transparent 46%, rgba(120,20,70,0.10) 100%);
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="vignette"></div>

<!-- Miniatura para el empaquetado standalone / fallback sin JS -->
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs><radialGradient id="g" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#ff2d8b"/>
      <stop offset="100%" stop-color="#d1006b"/>
    </radialGradient></defs>
    <rect width="100" height="100" fill="url(#g)"/>
    <g fill="none" stroke="#fff" stroke-width="2" opacity="0.9">
      <circle cx="50" cy="50" r="8"/><circle cx="50" cy="50" r="18"/><circle cx="50" cy="50" r="30"/>
    </g>
  </svg>
</template>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
  "use strict";
  if (!window.THREE) { console.error("Three.js no cargó"); return; }

  // ------------------------------------------------------------------ CONFIG
  var DEPTH      = 1000;
  var Z_START    = 80;
  var Z_END      = -(DEPTH - 80);
  var N_DUST     = 4200;
  var N_RINGS    = 20;
  var FOG_NEAR   = 40;
  var FOG_FAR    = 560;
  var LERP       = 0.06;
  var PARALLAX   = 3.0;
  var LOOK       = 6.0;

  // 6 tramos on-brand: blancos/blush/lila con fucsia-magenta como color de marca
  var ZONES = [
    { bg: 0xffffff, c: 0xff2d8b },
    { bg: 0xfff0f6, c: 0xe0117a },
    { bg: 0xfde7f0, c: 0xff6fae },
    { bg: 0xf6edfb, c: 0xb3138a },
    { bg: 0xfff2f7, c: 0xff2d8b },
    { bg: 0xffffff, c: 0xd1006b }
  ];
  var NZ = ZONES.length;
  var Z_BG = ZONES.map(function (z) { return new THREE.Color(z.bg); });
  var Z_C  = ZONES.map(function (z) { return new THREE.Color(z.c); });
  var DEEP = new THREE.Color(0x9e0f6a); // magenta profundo para contraste sobre blanco

  // ------------------------------------------------------------------ HELPERS
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smoothstep(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
  function zoneOf(z01) { return clamp(Math.floor(z01 * NZ), 0, NZ - 1); }

  var _tmpCol = new THREE.Color();
  function zoneColor(p, arr) {
    var t = p * (NZ - 1);
    var i = clamp(Math.floor(t), 0, NZ - 2);
    var f = smoothstep(0, 1, t - i);
    return _tmpCol.copy(arr[i]).lerp(arr[i + 1], f);
  }

  // ------------------------------------------------------------------ RENDERER / SCENE
  var canvas   = document.getElementById("bg-canvas");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, window.innerWidth < 820 ? 1.5 : 2));

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(ZONES[0].bg);
  scene.fog = new THREE.Fog(ZONES[0].bg, FOG_NEAR, FOG_FAR);

  var camera = new THREE.PerspectiveCamera(62, 1, 0.1, 2000);
  camera.position.set(0, 0, Z_START);

  // ------------------------------------------------------------------ POLVO / PARTÍCULAS (1 draw call, blending normal)
  var positions = new Float32Array(N_DUST * 3);
  var colors    = new Float32Array(N_DUST * 3);
  var sizes     = new Float32Array(N_DUST);
  var phases    = new Float32Array(N_DUST);
  var rMin = 8, rMax = 70;
  var col = new THREE.Color();
  for (var i = 0; i < N_DUST; i++) {
    var z = -Math.random() * DEPTH;
    var r = Math.sqrt(Math.random() * (rMax * rMax - rMin * rMin) + rMin * rMin);
    var a = Math.random() * Math.PI * 2;
    positions[i * 3]     = Math.cos(a) * r;
    positions[i * 3 + 1] = Math.sin(a) * r;
    positions[i * 3 + 2] = z;
    // ~14% magenta profundo para contraste sobre el blanco
    if (Math.random() < 0.08) col.copy(DEEP);
    else col.copy(Z_C[zoneOf(-z / DEPTH)]).multiplyScalar(0.8 + Math.random() * 0.35);
    colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
    sizes[i]  = 7 + Math.random() * 14;
    phases[i] = Math.random();
  }
  var dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  dustGeo.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
  dustGeo.setAttribute("aSize",  new THREE.BufferAttribute(sizes, 1));
  dustGeo.setAttribute("aPhase", new THREE.BufferAttribute(phases, 1));

  var dustMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uMouse: { value: new THREE.Vector2(0, 0) },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uSizeScale: { value: 1.0 }
    },
    transparent: true, depthWrite: false, blending: THREE.NormalBlending,
    vertexShader: [
      "attribute float aSize;", "attribute vec3 aColor;", "attribute float aPhase;",
      "uniform float uTime; uniform vec2 uMouse; uniform float uPixelRatio; uniform float uSizeScale;",
      "varying vec3 vColor; varying float vGlow; varying float vFade;",
      "void main(){",
      "  vColor = aColor;",
      "  vec4 mv = modelViewMatrix * vec4(position,1.0);",
      "  vec4 pr = projectionMatrix * mv;",
      "  float d = -mv.z;",
      "  float tw = 0.85 + 0.15*sin(uTime*1.4 + aPhase*6.2831);",
      "  vec2 ndc = pr.xy / pr.w;",
      "  float md = distance(ndc, uMouse);",
      "  float glow = smoothstep(0.34, 0.0, md);",
      "  vGlow = glow;",
      "  float nearF = smoothstep(4.0, 42.0, d);",
      "  float farF  = 1.0 - smoothstep(360.0, 560.0, d);",
      "  vFade = clamp(nearF*farF, 0.0, 1.0);",
      "  float s = aSize * uSizeScale * tw * (1.0 + glow*0.4);",
      "  gl_PointSize = clamp(s * uPixelRatio * (260.0 / max(1.0,d)), 0.5, 60.0);",
      "  gl_Position = pr;",
      "}"
    ].join("\n"),
    fragmentShader: [
      "varying vec3 vColor; varying float vGlow; varying float vFade;",
      "void main(){",
      "  vec2 c = gl_PointCoord - 0.5;",
      "  float r = length(c);",
      "  float alpha = smoothstep(0.5, 0.0, r) * vFade;",
      "  vec3 col = mix(vColor, vec3(1.0), vGlow*0.3);", // highlight sutil cerca del cursor
      "  gl_FragColor = vec4(col, alpha);",
      "}"
    ].join("\n")
  });
  var dust = new THREE.Points(dustGeo, dustMat);
  dust.frustumCulled = false;
  scene.add(dust);

  // ------------------------------------------------------------------ ANILLOS / GATES (blending normal)
  var rings = [];
  for (var k = 0; k < N_RINGS; k++) {
    var rz = -((k + 0.5) / N_RINGS) * DEPTH;
    var rad = 8 + Math.random() * 16;
    var geo = new THREE.TorusGeometry(rad, 0.14 + Math.random() * 0.24, 8, 64);
    var rc = Z_C[zoneOf(-rz / DEPTH)];
    var mat = new THREE.MeshBasicMaterial({
      color: rc, transparent: true, opacity: 0.4,
      blending: THREE.NormalBlending, depthWrite: false, fog: true
    });
    var ring = new THREE.Mesh(geo, mat);
    ring.position.set((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, rz);
    ring.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    scene.add(ring);
    rings.push(ring);
  }

  // ------------------------------------------------------------------ BEACONS (halos fucsia, 1 por tramo, fuera de eje)
  function makeGlow() {
    var s = 128, cv = document.createElement("canvas"); cv.width = cv.height = s;
    var g = cv.getContext("2d");
    var grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0, "rgba(255,255,255,0.95)");
    grd.addColorStop(0.30, "rgba(255,255,255,0.45)");
    grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd; g.fillRect(0, 0, s, s);
    return new THREE.CanvasTexture(cv);
  }
  var glowTex = makeGlow();
  var beacons = [];
  for (var b = 0; b < NZ; b++) {
    var bz = -((b + 0.5) / NZ) * DEPTH;
    var m = new THREE.SpriteMaterial({
      map: glowTex, color: Z_C[b], transparent: true, opacity: 0,
      blending: THREE.NormalBlending, depthWrite: false
    });
    var sp = new THREE.Sprite(m);
    var off = 12 + Math.random() * 14, ang = Math.random() * Math.PI * 2;
    sp.position.set(Math.cos(ang) * off, Math.sin(ang) * off, bz);
    var sc = 45 + Math.random() * 45; sp.scale.set(sc, sc, 1);
    scene.add(sp); beacons.push(sp);
  }

  // ------------------------------------------------------------------ SCROLL (motor) + postMessage
  var targetP = 0, currentP = 0, usingExternal = false;
  function readScroll() {
    if (usingExternal) return;
    var max = document.body.scrollHeight - window.innerHeight;
    targetP = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
  }
  window.addEventListener("scroll", readScroll, { passive: true });
  window.addEventListener("message", function (e) {
    var d = e.data;
    if (d && d.type === "scroll" && typeof d.progress === "number") {
      usingExternal = true;
      targetP = clamp(d.progress, 0, 1);
    }
  });

  // ------------------------------------------------------------------ MOUSE (parallax + highlight)
  var mx = 0, my = 0;
  window.addEventListener("pointermove", function (e) {
    mx = (e.clientX / window.innerWidth) * 2 - 1;
    my = -((e.clientY / window.innerHeight) * 2 - 1);
  }, { passive: true });
  window.addEventListener("pointerleave", function () { mx = 0; my = 0; });

  // ------------------------------------------------------------------ RESIZE (16:9 y 9:16)
  function resize() {
    var w = window.innerWidth, h = window.innerHeight, aspect = w / h;
    renderer.setSize(w, h, false);
    camera.aspect = aspect;
    camera.fov = aspect < 1 ? 78 : 62;
    camera.updateProjectionMatrix();
    dustMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
  }
  window.addEventListener("resize", resize);
  resize();
  readScroll();
  currentP = targetP;

  // ------------------------------------------------------------------ LOOP
  var clock = new THREE.Clock();
  var camX = 0, camY = 0;
  function tick() {
    requestAnimationFrame(tick);
    var t = clock.getElapsedTime();
    currentP += (targetP - currentP) * LERP;

    var bg = zoneColor(currentP, Z_BG);
    scene.background.copy(bg); scene.fog.color.copy(bg); renderer.setClearColor(bg, 1);

    var camZ = Z_START + (Z_END - Z_START) * currentP;
    var tx = mx * PARALLAX + Math.sin(t * 0.30) * 0.15;
    var ty = my * PARALLAX + Math.cos(t * 0.23) * 0.12;
    camX += (tx - camX) * 0.05; camY += (ty - camY) * 0.05;
    camera.position.set(camX, camY, camZ);
    camera.lookAt(mx * LOOK, my * LOOK, camZ - 60);

    dustMat.uniforms.uTime.value = t;
    dustMat.uniforms.uMouse.value.set(mx, my);

    for (var i = 0; i < beacons.length; i++) {
      var sp = beacons[i];
      var ahead = camera.position.z - sp.position.z;
      var op = ahead > 0 ? (1 - smoothstep(340, 560, ahead)) * smoothstep(0, 120, ahead) : 0;
      sp.material.opacity = op * 0.26;
      sp.visible = op > 0.01;
    }

    renderer.render(scene, camera);
  }
  tick();
})();
</script>
</body>
</html>
