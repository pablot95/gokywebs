<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de productos | Analiajoyas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="panel.css"></head><body><header class="admin-header"><a class="logo" href="../">Analiajoyas<i></i></a><span>Panel de productos</span><a href="../catalogo.html">Ver tienda ↗</a></header><main class="admin-main"><section id="login-view" class="login-box"><p class="eyebrow">ACCESO PRIVADO</p><h1>Administrar productos</h1><p>Ingresá tu clave para editar productos, precios y stock.</p><form id="login-form"><label for="key">Clave de administración</label><input id="key" type="password" required autocomplete="current-password"><button class="button button-black">Ingresar →</button></form><button class="preview-button" id="preview-panel" type="button">Ver panel en modo lectura ↗</button><p class="message" id="login-message" role="status"></p></section><section id="admin-view" hidden><div class="admin-title"><div><p class="eyebrow">CATÁLOGO</p><h1>Productos</h1><p>La lista carga hasta 100 productos por consulta.</p></div><button class="button button-black" id="new-product">+ Nuevo producto</button></div><div class="admin-tools"><label>Buscar <input type="search" id="admin-search" placeholder="Nombre, categoría o ID"></label><button type="button" id="logout">Cerrar sesión</button></div><p id="admin-status" role="status"></p><div id="admin-products" class="admin-products"></div><button class="button button-outline" id="admin-more" type="button" hidden>Ver más ↓</button></section><section class="edit-panel" id="edit-panel" hidden><div class="edit-head"><h2 id="edit-title">Producto</h2><button id="close-edit" type="button" aria-label="Cerrar editor">×</button></div><form id="product-form"><label>ID <input name="id" required maxlength="48" pattern="[A-Za-z0-9-]+"></label><label>Nombre <input name="nombre" required maxlength="150"></label><label>Categoría <select name="categoria"><option>Anillos</option><option>Aros</option><option>Collares</option><option>Pulseras</option><option>Relojes</option><option>Otras joyas</option></select></label><label>Precio de muestra ($) <input name="precio" type="number" min="0" step="1" required></label><label>Stock <input name="stock" type="number" min="0" step="1" required></label><label>Imagen (archivo en images/) <input name="imagen" placeholder="01_imagen.webp" pattern="[A-Za-z0-9_-]+\.(webp|png|jpg|jpeg)"></label><label>Descripción <textarea name="descripcion" rows="3" maxlength="400"></textarea></label><label class="check"><input name="destacado" type="checkbox"> Destacado en portada</label><button class="button button-black" type="submit">Guardar producto →</button><button class="delete-button" id="delete-product" type="button" hidden>Eliminar producto</button><p class="message" id="edit-message" role="status"></p></form></section></main><script src="panel.js" defer></script></body></html>
