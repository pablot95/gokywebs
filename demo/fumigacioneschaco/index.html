<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fumigaciones Chaco — Elegí la mejor versión</title>
<meta name="theme-color" content="#0f1d2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231466c4'/%3E%3Cpath d='M16 6l7 3v5c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V9z' fill='none' stroke='%23ffc20e' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100dvh;font-family:"Manrope",Arial,sans-serif;background:#0f1d2e;color:#e9f2fc;
    background-image:radial-gradient(60% 50% at 82% 0%,rgba(61,147,230,.16),transparent 60%),radial-gradient(55% 50% at 8% 100%,rgba(255,194,14,.12),transparent 60%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(1.5rem,5vw,4rem)}
  h1{font-size:clamp(1.6rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em;text-align:center;margin-bottom:clamp(1.8rem,4vw,3rem)}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1rem,3vw,2rem);width:min(100%,1000px)}
  .card{display:block;background:rgba(255,255,255,.04);border:1px solid rgba(140,175,215,.2);border-radius:18px;overflow:hidden;
    transition:transform .3s cubic-bezier(.23,1,.32,1),box-shadow .3s,border-color .3s;text-decoration:none;color:inherit}
  .card:hover,.card:focus-visible{transform:translateY(-6px);border-color:rgba(255,194,14,.6);box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .card:focus-visible{outline:3px solid #ffc20e;outline-offset:3px}
  .thumb{aspect-ratio:16/9;overflow:hidden;background:#13273c}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .label{padding:1rem 1.3rem;font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:space-between}
  .label svg{width:20px;height:20px;color:#ffc20e}
  @media (max-width:640px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
  <h1>Elegí la mejor versión.</h1>
  <div class="cards">
    <a class="card" href="version-1/">
      <div class="thumb"><img src="previews/version-1.webp" width="1440" height="810" alt="Vista previa de la Versión 1 de Fumigaciones Chaco, dirección clara y profesional"></div>
      <div class="label">Versión 1 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </a>
    <a class="card" href="version-2/">
      <div class="thumb"><img src="previews/version-2.webp" width="1440" height="810" alt="Vista previa de la Versión 2 de Fumigaciones Chaco, dirección oscura y de alto impacto"></div>
      <div class="label">Versión 2 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </a>
  </div>
<script src="/demo/track.js" defer></script>
</body>
</html>
