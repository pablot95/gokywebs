<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Video del panel de administración — GokyWebs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090C;
    --bg-soft:#0F1117;
    --light:#F5F5F7;
    --light-muted:#9AA3B2;
    --line-light:rgba(255,255,255,0.10);

    --font:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-display:'Space Grotesk', var(--font);
    --radius:16px;
    --shadow:0 18px 50px -30px rgba(0,0,0,0.7);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ min-height:100%; }
  body{
    font-family:var(--font);
    background:
      radial-gradient(70% 60% at 50% -10%, rgba(37,99,235,0.22), transparent 65%),
      var(--bg);
    color:var(--light);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  a{ color:inherit; }

  main{
    flex:1; width:100%; max-width:1180px; margin:0 auto;
    padding:44px 24px 48px; text-align:center;
  }
  .badge{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(59,130,246,0.14); border:1px solid rgba(59,130,246,0.32);
    color:#9DC0FF; font-size:12.5px; font-weight:600;
    letter-spacing:0.05em; text-transform:uppercase;
    padding:6px 14px; border-radius:999px; margin-bottom:18px;
  }
  h1{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(26px, 4vw, 38px); line-height:1.15;
    letter-spacing:-0.02em; margin-bottom:24px;
  }
  .video-frame{
    border-radius:var(--radius); overflow:hidden;
    box-shadow:var(--shadow); border:1px solid var(--line-light);
    aspect-ratio:1914/874; background:#000;
  }
  .video-frame video{ width:100%; height:100%; display:block; object-fit:contain; background:#000; }
  .video-meta{ margin-top:12px; color:var(--light-muted); font-size:13px; }

  footer{
    border-top:1px solid var(--line-light); padding:22px 24px;
    text-align:center; color:var(--light-muted); font-size:13.5px;
  }

  @media (max-width:600px){
    main{ padding:32px 16px 36px; }
  }
</style>
</head>
<body>

<main>
  <span class="badge">🛠️ Panel de administración</span>
  <h1>Cómo manejar tu tienda</h1>
  <div class="video-frame">
    <video controls preload="metadata" poster="poster-video.webp" playsinline>
      <source src="panel-admin-narrado-1.25x.mp4" type="video/mp4">
      Tu navegador no puede reproducir este video. Descargalo desde <a href="panel-admin-narrado-1.25x.mp4">este link</a>.
    </video>
  </div>
  <p class="video-meta">⏱️ 5:08</p>
</main>

<footer>
  GokyWebs — Panel de administración
</footer>

</body>
</html>
